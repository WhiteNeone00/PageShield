name: Deploy Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Notify Deploy Webhook
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          SHIELD_DEPLOY_NOTIFY_URL: ${{ secrets.SHIELD_DEPLOY_NOTIFY_URL }}
        run: |
          set -e
          url="${SHIELD_DEPLOY_NOTIFY_URL:-https://www.ryzeon.wtf/__shield/deploy-notify}"
          payload="{\"source\":\"github-actions\",\"sha\":\"${GITHUB_SHA}\"}"

          if [ -n "${STATS_API_KEY}" ]; then
            curl --fail --show-error --silent \
              --retry 3 --retry-delay 2 --retry-all-errors \
              -X POST "$url" \
              -H "authorization: Bearer ${STATS_API_KEY}" \
              -H "content-type: application/json" \
              --data "$payload"
          else
            curl --fail --show-error --silent \
              --retry 3 --retry-delay 2 --retry-all-errors \
              -X POST "$url" \
              -H "content-type: application/json" \
              --data "$payload"
          fi